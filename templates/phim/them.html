{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>🎬 Thêm Phim Mới</h1>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Tên Phim</label>
            <input type="text" name="ten_phim" required>
        </div>

        <div class="form-group">
            <label>Thời Lượng (phút)</label>
            <input type="number" name="thoi_luong" required>
        </div>

        <div class="form-group">
            <label>Ngày Khởi Chiếu</label>
            <input type="date" name="ngay_khoi_chieu" required>
        </div>

        <div class="form-group">
            <label>Giới Hạn Độ Tuổi</label>
            <select name="ma_gioi_han" required>
                {% for gh in ds_gioi_han %}
                <option value="{{ gh.MaGioiHan }}">
                    {{ gh.KyHieu }} - {{ gh.MoTa }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Link Trailer (Youtube Embed URL)</label>
            <input type="url" name="trailer" placeholder="https://www.youtube.com/embed/..." required>
        </div>

        <div class="form-group">
            <label>Tải Lên Ảnh Poster</label>
            <input type="file" name="poster_file" accept="image/*" required>
        </div>

        <div class="form-group">
            <label>Mô Tả Nội Dung Phim</label>
            <textarea name="mo_ta" rows="4" required style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color);"></textarea>
        </div>

        <div class="form-group">
            <label>Thể Loại</label>
            <select name="ma_the_loai">
                {% for tl in ds_the_loai %}
                <option value="{{ tl.MaTheLoai }}">
                    {{ tl.TenTheLoai }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-top:20px;">
            <button type="submit" class="btn">
                💾 Lưu Phim
            </button>

            <a href="/phim" class="btn"
               style="background:#6b7280;">
               Hủy
            </a>
        </div>
    </form>
</div>
{% endblock %}
