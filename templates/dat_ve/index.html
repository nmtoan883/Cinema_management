{% extends "base.html" %}

{% block content %}
<div class="card inline-style-72" >
    <h2 class="inline-style-68" >🎟️ Đặt Vé Phim</h2>
    <form action="/datve/ban-ve" method="POST" id="bookingForm">
        <!-- STEP 1: BOOKING -->
        <div id="step_booking">
            <!-- Bước 1: Chọn Phim -->
            <div class="form-group">
                <label>1. Chọn Phim Đang Chiếu</label>
                <select id="phimSelect" class="form-control" onchange="loadSuatChieu()" required>
                    <option value="">-- Chọn Phim --</option>
                    {% for phim in ds_phim %}
                    <option value="{{ phim.MaPhim }}" {% if selected_phim_id == phim.MaPhim|string %}selected{% endif %}>
                        {{ phim.TenPhim }} ({{ phim.GioiHanDoTuoi }})
                    </option>
                    {% endfor %}
                </select>
            </div>

        <!-- Bước 2: Chọn Cơ Sở -->
        <div class="form-group inline-style-73" id="cumRapContainer" >
            <label>2. Chọn Cơ Sở</label>
            <div class="inline-style-74" id="cumRapList" >
                <!-- Cơ sở render bằng JS -->
            </div>
        </div>

        <!-- Bước 3: Chọn Ngày Chiếu -->
        <div class="form-group inline-style-73" id="ngayChieuContainer" >
            <label>3. Chọn Ngày Chiếu</label>
            <div class="inline-style-74" id="ngayChieuList" >
                <!-- Ngày chiếu render bằng JS -->
            </div>
        </div>

        <!-- Bước 4: Chọn Giờ Chiếu -->
        <div class="form-group inline-style-73" id="suatChieuContainer" >
            <label>4. Chọn Giờ Chiếu</label>
            <div class="inline-style-74" id="suatChieuList" >
                <!-- Suất chiếu render bằng JS -->
            </div>
            <input type="hidden" name="ma_suat" id="maSuatInput" required>
        </div>

        <!-- Bước 5: Chọn Ghế -->
        <div class="form-group inline-style-73" id="gheContainer" >
            <label>5. Chọn Ghế Ngồi</label>
            <div class="inline-style-75" >
                <div class="inline-style-76" >MÀN HÌNH</div>
                
                <div class="inline-style-77" id="gheList" >
                    <!-- Ghế render bằng JS -->
                </div>
            </div>
            
            <div class="inline-style-78" >
                <span title="Ghế Thường"><div class="inline-style-79" ></div> Thường</span>
                <span title="Ghế VIP"><div class="inline-style-80" ></div> VIP</span>
                <span title="Ghế Couple"><div class="inline-style-81" ></div> Couple</span>
                <span class="inline-style-82" ><div class="inline-style-83" ></div> Đang chọn</span>
                <span><div class="inline-style-84" ></div> Đã bán</span>
            </div>
            <input type="hidden" name="ma_ghe" id="maGheInput" required>
            <div style="margin-top: 2rem; text-align: right;">
                <button type="button" id="btnNextToFnb" class="btn" style="display: none; background: var(--primary); color: white; padding: 10px 25px; border-radius: 8px; border: none; font-size: 1.1rem; cursor: pointer;">Tiếp tục: Chọn Bắp Nước</button>
            </div>
        </div>
        </div>
        
        <!-- STEP 2: F&B -->
        <div id="step_fnb" style="display: none;">
            <div class="form-group" id="fnbContainer">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                    <h2>Bước 6: Chọn Bắp Nước (Tuỳ chọn)</h2>
                </div>
                <div id="fnbList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;">
                    <!-- Render F&B items via JS -->
                </div>
            </div>
            <div style="margin-top: 2rem; display: flex; justify-content: space-between;">
                <button type="button" id="btnBackToBooking" class="btn" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: white; padding: 10px 25px; border-radius: 8px; cursor: pointer;">Quay lại chọn ghế</button>
                <div>
                    <button type="button" id="btnSkipFnb" class="btn" style="background: transparent; color: var(--text-muted); border: none; margin-right: 15px; cursor: pointer;">Bỏ qua</button>
                    <button type="button" id="btnNextToCheckout" class="btn" style="background: var(--primary); color: white; padding: 10px 25px; border-radius: 8px; border: none; font-size: 1.1rem; cursor: pointer;">Tiếp tục: Thanh Toán</button>
                </div>
            </div>
        </div>

        <!-- STEP 3: CHECKOUT -->
        <div id="step_checkout" style="display: none;">
            <div class="form-group inline-style-85" id="checkoutContainer">
                {% if current_user_role == 'nhanvien' %}
                <label>Số Điện Thoại Khách Hàng (Dùng để cộng điểm)</label>
                <input type="text" name="ma_kh" placeholder="Nhập SDT khách hàng (Bắt buộc)" required>
                {% endif %}
                
                <div class="inline-style-86" >
                    <h3 class="inline-style-87" >Xác nhận đặt vé</h3>
                    <p style="margin-bottom: 0.5rem;">Ghế đã chọn: <strong id="selectedGheText">Chưa chọn</strong></p>
                    <p style="margin-bottom: 0.5rem;">Bắp Nước: <strong id="selectedFnbText">0đ</strong></p>
                    <p>Tổng tiền: <strong id="totalPriceText" style="color: #10b981; font-size: 1.2rem;">0 ₫</strong></p>
                </div>
                
                <div style="margin-top: 2rem; display: flex; justify-content: space-between; align-items: center;">
                    <button type="button" id="btnBackToFnb" class="btn" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: white; padding: 10px 25px; border-radius: 8px; cursor: pointer;">Quay lại Bắp Nước</button>
                    <button type="submit" class="btn inline-style-88" style="padding: 12px 30px; font-size: 1.2rem;" >Thanh Toán & In Vé</button>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="{{ url_for('static', filename='dat_ve.js') }}?v=1.2"></script>
{% endblock %}
