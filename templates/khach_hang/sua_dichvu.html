{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem; color: #f59e0b;">Cập Nhật Giá Bán</h2>
    
    <form action="/khachhang/dichvu/sua/{{ dich_vu.MaDichVu }}" method="POST">
        <div class="form-group">
            <label>Tên Món (Không được sửa)</label>
            <input type="text" value="{{ dich_vu.TenDichVu }}" disabled style="opacity: 0.7;">
        </div>
        
        <div class="form-group">
            <label>Giá Bán Mới (VNĐ) (*)</label>
            <input type="number" name="gia_ban" value="{{ dich_vu.GiaBan }}" min="0" required>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn" style="flex: 1; background: #f59e0b; color: #000;">Lưu Thay Đổi</button>
            <a href="/khachhang" class="btn" style="background: #4b5563; text-align: center;">Hủy Bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
