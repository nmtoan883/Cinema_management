{% extends "base.html" %}

{% block content %}
<div class="card inline-style-115" >
    <h2 class="inline-style-123" >Đăng Ký Khách Hàng Mới</h2>
    
    <form action="/khachhang/them" method="POST">
        <div class="form-group">
            <label>Họ và Tên (*)</label>
            <input type="text" name="ho_ten" placeholder="Nhập họ tên đầy đủ" required>
        </div>
        
        <div class="form-group">
            <label>Số Điện Thoại (*)</label>
            <input type="tel" name="sdt" placeholder="Ví dụ: 0901234567" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="example@gmail.com">
        </div>

        <div class="inline-style-118" >
            <button type="submit" class="btn inline-style-96" >Tạo Khách Hàng</button>
            <a href="/khachhang" class="btn inline-style-120" >Hủy Bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
