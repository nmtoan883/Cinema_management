{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem; color: #10b981;">Thêm Món (Bắp/Nước) Mới</h2>
    
    <form action="/khachhang/dichvu/them" method="POST">
        <div class="form-group">
            <label>Tên Món (*)</label>
            <input type="text" name="ten_dich_vu" placeholder="Ví dụ: Combo 2 Bắp 1 Nước" required>
        </div>
        
        <div class="form-group">
            <label>Giá Bán (VNĐ) (*)</label>
            <input type="number" name="gia_ban" placeholder="Ví dụ: 85000" min="0" required>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn" style="flex: 1; background: #10b981;">Thêm Món Mới</button>
            <a href="/khachhang" class="btn" style="background: #4b5563; text-align: center;">Hủy Bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
