{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem; color: #8b5cf6;">Khai Báo Nhân Sự Mới</h2>
    
    <form action="/khachhang/nhanvien/them" method="POST">
        <div class="form-group">
            <label>Họ và Tên Nhân Viên (*)</label>
            <input type="text" name="ho_ten" placeholder="Nhập tên nhân viên" required>
        </div>
        
        <div class="form-group">
            <label>Chức Vụ (*)</label>
            <select name="chuc_vu" required>
                <option value="Bán vé">Nhân viên Bán vé / Bắp nước</option>
                <option value="Soát vé">Nhân viên Soát vé</option>
                <option value="Quản lý rạp">Quản lý Cụm Rạp</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nơi Làm Việc (Cụm Rạp) (*)</label>
            <select name="ma_cum_rap" required>
                {% for rap in ds_rap %}
                <option value="{{ rap.MaCumRap }}">{{ rap.TenCumRap }}</option>
                {% endfor %}
            </select>
            <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">(Danh sách rạp được lấy từ Phân hệ Cơ sở vật chất của Thành viên 2)</small>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn" style="flex: 1; background: #8b5cf6;">Lưu Nhân Viên</button>
            <a href="/khachhang" class="btn" style="background: #4b5563; text-align: center;">Hủy Bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
