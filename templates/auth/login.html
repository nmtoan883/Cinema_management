{% extends "base.html" %}

{% block content %}
<div class="card inline-style-59" >
    <h2 class="inline-style-60" >Đăng Nhập</h2>
    <p class="inline-style-61" >Vui lòng nhập thông tin để truy cập hệ thống</p>
    
    <form class="inline-style-62" action="/auth/login" method="POST" >
        <div class="form-group">
            <label>Số điện thoại (Khách) hoặc Tên đăng nhập (NV)</label>
            <input type="text" name="username" placeholder="Ví dụ: 0901234567 hoặc admin" required>
        </div>
        
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu (mặc định 123456)" required>
        </div>
        
        <button type="submit" class="btn inline-style-63" >Đăng Nhập</button>
    </form>
    
    <div class="inline-style-64" >
        <p class="inline-style-65" >Khách hàng chưa có tài khoản?</p>
        <a href="/auth/register" class="btn inline-style-66" >Tạo Tài Khoản Mới</a>
    </div>
</div>
{% endblock %}
