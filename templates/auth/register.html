{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2 style="color: var(--primary); margin-bottom: 1.5rem; text-align: center;">Đăng Ký Thành Viên Mới</h2>
    
    <form action="/auth/register" method="POST">
        <div class="form-group">
            <label>Họ và Tên (*)</label>
            <input type="text" name="ho_ten" placeholder="Nhập họ và tên đầy đủ" required>
        </div>
        
        <div class="form-group">
            <label>Số Điện Thoại (*)</label>
            <input type="text" name="sdt" placeholder="Sẽ được dùng làm tên đăng nhập" required>
        </div>
        
        <div class="form-group">
            <label>Email (Tùy chọn)</label>
            <input type="email" name="email" placeholder="Nhập địa chỉ email">
        </div>
        
        <div class="form-group">
            <label>Mật khẩu (*)</label>
            <input type="password" name="mat_khau" placeholder="Tạo mật khẩu an toàn" required>
        </div>
        
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; font-size: 1.1rem; background: #10b981;">Đăng Ký Ngay</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem;">
        <p style="color: var(--text-muted);">Đã có tài khoản? <a href="/auth/login" style="color: var(--primary); text-decoration: none; font-weight: 500;">Đăng nhập</a></p>
    </div>
</div>
{% endblock %}
