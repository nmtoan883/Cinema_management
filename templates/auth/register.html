{% extends "base.html" %}

{% block content %}
<div class="card inline-style-67" >
    <h2 class="inline-style-68" >Đăng Ký Thành Viên Mới</h2>
    
    <form action="/auth/register" method="POST">
        <div class="form-group">
            <label>Họ và Tên (*)</label>
            <input type="text" name="ho_ten" placeholder="Nhập họ và tên đầy đủ" required>
        </div>
        
        <div class="form-group">
            <label>Số Điện Thoại (*)</label>
            <input type="text" name="sdt" placeholder="Sẽ được dùng làm tên đăng nhập" required>
        </div>
        
        <div class="form-group">
            <label>Email (Tùy chọn)</label>
            <input type="email" name="email" placeholder="Nhập địa chỉ email">
        </div>
        
        <div class="form-group">
            <label>Mật khẩu (*)</label>
            <input type="password" name="mat_khau" placeholder="Tạo mật khẩu an toàn" required>
        </div>
        
        <button type="submit" class="btn inline-style-69" >Đăng Ký Ngay</button>
    </form>
    
    <div class="inline-style-70" >
        <p class="inline-style-65" >Đã có tài khoản? <a class="inline-style-71" href="/auth/login" >Đăng nhập</a></p>
    </div>
</div>
{% endblock %}
